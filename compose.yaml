services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: vvd_dev
      POSTGRES_USER: vvd
      POSTGRES_PASSWORD: vvd
    ports:
      - "5432:5432"
    volumes:
      - vvd-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vvd -d vvd_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vvd-postgres:
